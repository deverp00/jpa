<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP · Login</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <style>
        /* Additional page-specific styles */
        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--light-bg);
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: var(--border);
            padding: 40px 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
        }

        .login-card .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-card .logo-area svg {
            width: 48px;
            height: 48px;
            fill: var(--primary);
            display: block;
            margin: 0 auto 12px;
        }

        .login-card .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .login-card .logo-area p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .login-form .input-wrapper {
            display: flex;
            align-items: center;
            border: var(--border);
            border-radius: var(--border-radius);
            background: var(--card-bg);
            padding: 0 12px;
            transition: border-color 0.2s;
        }

        .login-form .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .login-form .input-wrapper svg {
            width: 18px;
            height: 18px;
            fill: var(--secondary);
            flex-shrink: 0;
            margin-right: 10px;
        }

        .login-form .input-wrapper input {
            border: none;
            outline: none;
            background: transparent;
            padding: 12px 0;
            font-size: 14px;
            width: 100%;
            color: var(--text-main);
        }

        .login-form .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .login-form .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin: 12px 0 24px;
        }

        .login-form .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-form .form-options a:hover {
            text-decoration: underline;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-form button:hover {
            background: var(--primary-dark);
        }

        .login-form .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-form .signup-link a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .login-form .signup-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER (minimal, just to maintain consistency) -->
    <header class="app-header">
        <div class="header-left">
            <svg class="logo-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <span class="logo-text">ERP·Nexus</span>
        </div>
        <div class="header-center"></div>
        <div class="header-right"></div>
    </header>

    <!-- MAIN LOGIN -->
    <main class="login-main">
        <div class="login-card">
            <div class="logo-area">
                <!-- Logo SVG -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                <h1>Welcome Back</h1>
                <p>Sign in to your ERP dashboard</p>
            </div>

            <form class="login-form" id="loginForm" action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <!-- Email icon SVG -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input type="email" id="email" placeholder="admin@erp.com" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <!-- Lock icon SVG -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>
                </div>

                <div class="form-options">
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">Sign In</button>

                <div class="signup-link">
                    Don't have an account? <a href="#">Contact Admin</a>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>&copy; 2026 ERP·Nexus — Secure · Reliable · Modern</p>
        <div class="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Support</a>
        </div>
    </footer>

    <script>
        // Optional: simple form submission handler (prevents actual navigation)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // For demo: redirect to dashboard (or perform authentication)
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>

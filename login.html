<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Janaki Professional Academy ERP</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/footer.css" />
</head>
<body>

    <!-- ========== AUTH WRAPPER ========== -->
    <div class="auth-wrapper">

        <!-- ========== LOGIN MAIN ========== -->
        <main class="auth-main">
            <div class="auth-container auth-container--login">

                <!-- Back to Home -->
                <div class="auth-back-link">
                    <a href="index.html">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        Back to Home
                    </a>
                </div>

                <!-- Branding -->
                <div class="auth-brand auth-brand--login">
                    <div class="auth-logo-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                    </div>
                    <h2 class="auth-institution-name auth-institution-name--login">Janaki Professional Academy</h2>
                    <p class="auth-subtitle">Sign in to your ERP dashboard</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form" novalidate>
                    <!-- Email -->
                    <div class="form-group">
                        <label for="loginEmail" class="form-label">Email Address</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                            </span>
                            <input type="email" id="loginEmail" class="form-input" placeholder="admin@janakipa.edu.in" required />
                        </div>
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="loginPassword" class="form-label">Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </span>
                            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required />
                            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <span class="form-error" id="passwordError"></span>
                    </div>

                    <!-- Options: Remember + Forgot -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" />
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-spinner hidden" id="loginSpinner">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spinner">
                                <line x1="12" y1="2" x2="12" y2="6" />
                                <line x1="12" y1="18" x2="12" y2="22" />
                                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />
                                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07" />
                                <line x1="2" y1="12" x2="6" y2="12" />
                                <line x1="18" y1="12" x2="22" y2="12" />
                                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24" />
                                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93" />
                            </svg>
                        </span>
                    </button>
                </form>

                <!-- Demo Credentials Hint (Phase 1 only) -->
                <div class="auth-demo-hint">
                    <p><strong>Demo Credentials</strong><br />
                    Email: admin@janakipa.edu.in<br />
                    Password: admin123</p>
                    <p class="demo-note">(Phase 1 static demo – Firebase auth coming in Phase 2)</p>
                </div>
            </div>
        </main>

        <!-- ========== FOOTER ========== -->
        <footer class="site-footer">
            <div class="footer-inner">
                <p class="footer-copy">
                    &copy; 2026 Janaki Professional Academy. All rights reserved.
                </p>
                <p class="footer-powered">
                    School Management ERP
                </p>
            </div>
        </footer>
    </div>

    <!-- ========== EXTERNAL JAVASCRIPT ========== -->
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toggle.js"></script>
</body>
</html>
